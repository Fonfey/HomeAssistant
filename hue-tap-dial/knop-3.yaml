# Philips Hue Tap Dial: voorbeeld uit https://fonferek.nl/blog/hue-tap-dial-home-assistant-een-knop-voor-alles/
# Vervang event.tap_dial_*, light.lamp_a, light.lamp_b en light.groep_c door je eigen entiteiten.
# Nodig: input_select.tap_dial_groep (opties: Lamp A, Lamp B, Groep C) en input_text.lamp_a_scene / input_text.lamp_b_scene.
alias: Tap Dial - knop 3 (scènes Lamp A)
triggers:
  - trigger: state
    entity_id: event.tap_dial_button_3
    attribute: event_type
    to: short_release
    id: kort
  - trigger: state
    entity_id: event.tap_dial_button_3
    attribute: event_type
    to: long_release
    id: lang
actions:
  - choose:
      - conditions: [{ condition: trigger, id: kort }]
        sequence:
          - variables:
              # Alle scènes van deze lampgroep uit de Hue-app, live opgehaald en op alfabet.
              scenes: >
                {{ states.scene | selectattr('entity_id', 'match', '^scene\.lamp_a_')
                   | map(attribute='entity_id') | sort | list }}
              huidige: >
                {{ scenes.index(states('input_text.lamp_a_scene'))
                   if states('input_text.lamp_a_scene') in scenes else -1 }}
              volgende: "{{ scenes[(huidige + 1) % (scenes | length)] if scenes else '' }}"
          - condition: template
            value_template: "{{ volgende != '' }}"
          - action: scene.turn_on
            target: { entity_id: "{{ volgende }}" }
          - action: input_text.set_value
            target: { entity_id: input_text.lamp_a_scene }
            data: { value: "{{ volgende }}" }
          - action: input_select.select_option
            target: { entity_id: input_select.tap_dial_groep }
            data: { option: Lamp A }
      - conditions: [{ condition: trigger, id: lang }]
        sequence:
          - action: light.turn_off
            target: { entity_id: light.lamp_a }
mode: single
