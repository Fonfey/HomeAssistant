blueprint:
  name: Marstek - Laden bij laagste stroomprijs
  description: |
    Start het laden van de Marstek-batterij op het goedkoopste uur van de dag.
    De automation controleert bij elke prijswijziging of:
    - het huidige uur het goedkoopste uur van vandaag is;
    - de batterij onder de 60% zit;
    - de zonnepanelen minder dan 1000 W leveren (alleen als je een zonnepanelen-sensor hebt gekozen);
    - de laad-automation niet al bezig is.
    Als alles klopt, wordt de laad-automation gestart.
    Gemaakt voor de Zonneplan-integratie.
  domain: automation
  source_url: https://github.com/Fonfey/HomeAssistant/blob/main/Marstek_Laden_laagste_stroomprijs.yaml
  input:
    tariff_sensor:
      name: Huidig stroomtarief
      description: >-
        De Zonneplan-sensor met de huidige stroomprijs. Deze sensor bevat ook de
        prijzen van de rest van de dag, zodat het goedkoopste uur bepaald kan
        worden. Bij elke prijswijziging wordt de automation gecontroleerd.
      selector:
        entity:
          filter:
            - domain: sensor
    battery_soc_sensor:
      name: Batterij laadniveau (SoC)
      description: >-
        De sensor met het huidige laadpercentage van de batterij. Er wordt alleen geladen als deze
        onder de 60% zit.
      selector:
        entity:
          filter:
            - domain: sensor
    pv_power_sensor:
      name: Zonnepanelen vermogen (optioneel)
      description: >-
        De sensor met het huidige vermogen van je zonnepanelen in watt. Er
        wordt dan alleen geladen als de zonnepanelen minder dan 1000 W
        leveren, zodat je niet duur laadt terwijl de zon het gratis kan doen.
        Heb je meerdere omvormers, kies ze dan allemaal; ze worden opgeteld.
        Heb je geen zonnepanelen, laat dit dan leeg.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
    charge_automation:
      name: Laad-automation
      description: >-
        De automation die de batterij daadwerkelijk laat laden. Deze wordt gestart zonder zijn eigen
        voorwaarden te controleren. Er wordt niet opnieuw gestart als hij al
        bezig is.
      selector:
        entity:
          filter:
            - domain: automation

mode: single

variables:
  tariff_sensor: !input tariff_sensor
  pv_power_sensor: !input pv_power_sensor
  # Zonneplan: forecast-prijzen staan in 1/10.000.000 euro
  price_factor: 10000000

triggers:
  - trigger: state
    entity_id: !input tariff_sensor

conditions:
  - condition: numeric_state
    entity_id: !input battery_soc_sensor
    below: 60
  # Zonnepanelen onder 1000 W (overgeslagen als er geen sensor is gekozen)
  - condition: template
    value_template: >-
      {% set pv = [pv_power_sensor] if pv_power_sensor is string else (pv_power_sensor or []) %}
      {% set pv = pv | reject('eq', '') | list %}
      {% if pv | count == 0 %}
        true
      {% else %}
        {% set waarden = pv | map('states') | list %}
        {{ waarden | select('is_number') | list | count == pv | count
           and waarden | map('float') | sum < 1000 }}
      {% endif %}
  - condition: template
    value_template: >-
      {% set vandaag = now().date().isoformat() %}
      {% set forecast = state_attr(tariff_sensor, 'forecast') or [] %}
      {% set prijzen = forecast
           | selectattr('start_date', 'match', '^' ~ vandaag)
           | map(attribute='electricity_price') | list %}
      {{ prijzen | count > 0 and
         ((states(tariff_sensor) | float(0) * price_factor) | round(0)) == prijzen | min }}
  - condition: numeric_state
    entity_id: !input charge_automation
    attribute: current
    below: 1

actions:
  - action: automation.trigger
    target:
      entity_id: !input charge_automation
    data:
      skip_condition: true
