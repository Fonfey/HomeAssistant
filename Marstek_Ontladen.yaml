blueprint:
  name: Marstek - Ontladen
  description: |
    Ontlaadt de Marstek-batterijen met het ingestelde ontlaadvermogen per batterij (standaard 2500 W) gedurende de ingestelde ontlaadduur (standaard 1 uur) en zet ze daarna terug in de normale stand.
    Deze automation heeft geen eigen trigger. Hij wordt gestart door een andere automation, bijvoorbeeld een automation die bij een hoge stroomprijs wil ontladen.
    Wat er gebeurt:
    - De batterijen gaan in standby, de werkmodus wordt *anti_feed* en RS485-besturing gaat uit.
    - Na 10 seconden wordt het ontlaadvermogen ingesteld, de batterijen gaan op *discharge* en RS485-besturing gaat aan.
    - Na de ingestelde ontlaadduur gaan de batterijen weer in standby, de werkmodus blijft *anti_feed* en RS485-besturing gaat uit.
  domain: automation
  source_url: https://github.com/Fonfey/HomeAssistant/blob/main/Marstek_Ontladen.yaml
  input:
    force_mode_selects:
      name: Force mode
      description: >-
        De keuzelijsten waarmee de batterij geforceerd wordt ontladen of in
        standby gezet. Kies er één per batterij.
      selector:
        entity:
          multiple: true
          filter:
            - integration: marstek_modbus
              domain: select
    work_mode_selects:
      name: Werkmodus (user work mode)
      description: >-
        De keuzelijsten met de werkmodus van de batterij. Deze worden op
        *anti_feed* gezet, zodat er niet terug geleverd wordt aan het net.
        Kies er één per batterij.
      selector:
        entity:
          multiple: true
          filter:
            - integration: marstek_modbus
              domain: select
    rs485_switches:
      name: RS485-besturing
      description: >-
        De schakelaars die de Modbus/RS485-besturing aan- en uitzetten. Die
        moet aan staan tijdens het geforceerd ontladen en gaat daarna weer uit.
        Kies er één per batterij.
      selector:
        entity:
          multiple: true
          filter:
            - integration: marstek_modbus
              domain: switch
    discharge_power_numbers:
      name: Ontlaadvermogen-entiteiten
      description: >-
        De instellingen voor het ontlaadvermogen van de batterij. Deze worden op
        het ingestelde vermogen gezet. Kies er één per batterij.
      selector:
        entity:
          multiple: true
          filter:
            - integration: marstek_modbus
              domain: number
    discharge_power_value:
      name: Ontlaadvermogen per batterij
      description: >-
        Met hoeveel watt elke batterij ontlaadt. Standaard 2500 W. Vul het
        vermogen in dat jouw batterij en aansluiting aankunnen; kijk in de
        specificaties van je batterij voor het maximum.
      default: 2500
      selector:
        number:
          min: 100
          max: 10000
          step: 50
          unit_of_measurement: W
          mode: box
    discharge_duration:
      name: Ontlaadduur
      description: >-
        Hoe lang de batterijen geforceerd ontladen voordat ze weer terug in
        standby gaan. Standaard is dit 1 uur.
      default:
        hours: 1
        minutes: 0
        seconds: 0
      selector:
        duration:

mode: single

triggers: []

actions:
  # Voorbereiden: standby, anti_feed en RS485 uit
  - action: select.select_option
    target:
      entity_id: !input force_mode_selects
    data:
      option: standby
  - action: select.select_option
    target:
      entity_id: !input work_mode_selects
    data:
      option: anti_feed
  - action: switch.turn_off
    target:
      entity_id: !input rs485_switches
  - delay:
      seconds: 10

  # Ontladen starten
  - action: number.set_value
    target:
      entity_id: !input discharge_power_numbers
    data:
      value: !input discharge_power_value
  - action: select.select_option
    target:
      entity_id: !input force_mode_selects
    data:
      option: discharge
  - action: switch.turn_on
    target:
      entity_id: !input rs485_switches

  # Ontladen gedurende de ingestelde ontlaadduur
  - delay: !input discharge_duration

  # Terug naar normaal
  - action: select.select_option
    target:
      entity_id: !input force_mode_selects
    data:
      option: standby
  - action: select.select_option
    target:
      entity_id: !input work_mode_selects
    data:
      option: anti_feed
  - action: switch.turn_off
    target:
      entity_id: !input rs485_switches
