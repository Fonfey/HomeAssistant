blueprint:
  name: Marstek - Opladen
  description: |
    Laadt de Marstek-batterijen met het ingestelde laadvermogen per batterij (standaard 2500 W) gedurende de ingestelde laadduur (standaard 1 uur) en zet ze daarna terug in de normale stand.
    Deze automation heeft geen eigen trigger. Hij wordt gestart door een andere automation, bijvoorbeeld de blueprint **Marstek - Laden bij laagste stroomprijs**.
    Wat er gebeurt:
    - De batterijen gaan in standby, de werkmodus wordt *anti_feed* en RS485-besturing gaat uit.
    - Na 10 seconden wordt het laadvermogen ingesteld, de batterijen gaan op *charge* en RS485-besturing gaat aan.
    - Na de ingestelde laadduur, of eerder zodra alle batterijen 100% zijn, gaan de batterijen weer in standby, de werkmodus blijft *anti_feed* en RS485-besturing gaat uit.
  domain: automation
  source_url: https://github.com/Fonfey/HomeAssistant/blob/main/Marstek_Opladen.yaml
  input:
    force_mode_selects:
      name: Force mode
      description: >-
        De keuzelijsten waarmee de batterij geforceerd wordt geladen of in
        standby gezet. Kies er één per batterij.
      selector:
        entity:
          multiple: true
          filter:
            - domain: select
    work_mode_selects:
      name: Werkmodus (user work mode)
      description: >-
        De keuzelijsten met de werkmodus van de batterij. Deze worden op
        *anti_feed* gezet, zodat er niet terug geleverd wordt aan het net.
        Kies er één per batterij.
      selector:
        entity:
          multiple: true
          filter:
            - domain: select
    rs485_switches:
      name: RS485-besturing
      description: >-
        De schakelaars die de Modbus/RS485-besturing aan- en uitzetten. Die
        moet aan staan tijdens het geforceerd laden en gaat daarna weer uit.
        Kies er één per batterij.
      selector:
        entity:
          multiple: true
          filter:
            - domain: switch
    charge_power_numbers:
      name: Laadvermogen-entiteiten
      description: >-
        De instellingen voor het laadvermogen van de batterij. Deze worden op
        het ingestelde vermogen gezet. Kies er één per batterij.
      selector:
        entity:
          multiple: true
          filter:
            - domain: number
    charge_power_value:
      name: Laadvermogen per batterij
      description: >-
        Met hoeveel watt elke batterij laadt. Standaard 2500 W. Vul het
        vermogen in dat jouw batterij en aansluiting aankunnen; kijk in de
        specificaties van je batterij voor het maximum.
      default: 2500
      selector:
        number:
          min: 100
          max: 10000
          step: 50
          unit_of_measurement: W
          mode: box
    charge_duration:
      name: Laadduur
      description: >-
        Hoe lang de batterijen geforceerd laden voordat ze weer terug in
        standby gaan. Standaard is dit 1 uur.
      default:
        hours: 1
        minutes: 0
        seconds: 0
      selector:
        duration:
    battery_soc_sensors:
      name: Laadniveau-sensoren (optioneel)
      description: >-
        De sensoren met het laadpercentage (SoC) van de batterijen. Kies er
        één per batterij. Het laden stopt dan eerder zodra alle batterijen
        100% zijn, in plaats van de volledige laadduur door te laden. Laat
        leeg om altijd de volledige laadduur te laden.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor

mode: single

variables:
  battery_soc_sensors: !input battery_soc_sensors

triggers: []

actions:
  # Voorbereiden: standby, anti_feed en RS485 uit
  - action: select.select_option
    target:
      entity_id: !input force_mode_selects
    data:
      option: standby
  - action: select.select_option
    target:
      entity_id: !input work_mode_selects
    data:
      option: anti_feed
  - action: switch.turn_off
    target:
      entity_id: !input rs485_switches
  - delay:
      seconds: 10

  # Laden starten
  - action: number.set_value
    target:
      entity_id: !input charge_power_numbers
    data:
      value: !input charge_power_value
  - action: select.select_option
    target:
      entity_id: !input force_mode_selects
    data:
      option: charge
  - action: switch.turn_on
    target:
      entity_id: !input rs485_switches

  # Laden gedurende de ingestelde laadduur, of tot alle batterijen 100% zijn
  - if:
      - condition: template
        value_template: "{{ battery_soc_sensors | count > 0 }}"
    then:
      - wait_template: >-
          {{ battery_soc_sensors | map('states') | map('float', 0) | min >= 100 }}
        timeout: !input charge_duration
        continue_on_timeout: true
    else:
      - delay: !input charge_duration

  # Terug naar normaal
  - action: select.select_option
    target:
      entity_id: !input force_mode_selects
    data:
      option: standby
  - action: select.select_option
    target:
      entity_id: !input work_mode_selects
    data:
      option: anti_feed
  - action: switch.turn_off
    target:
      entity_id: !input rs485_switches
