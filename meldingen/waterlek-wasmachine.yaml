# Uitleg: https://fonferek.tech/blog/home-assistant-meldingen-afval-waterlek-batterij/
# Gebruikt de meldingsgroep notify.ik (zie de blog). Vervang de entiteiten door die van jezelf.
alias: Melding - waterlek wasmachine
triggers:
  - trigger: state
    entity_id: binary_sensor.wasmachine_water_sensor_vocht
    from: 'off'
    to: 'on'
actions:
  - action: notify.send_message
    target:
      entity_id: notify.ik
    data:
      title: Lekkage
      message: Er staat water bij de wasmachine.
mode: single
