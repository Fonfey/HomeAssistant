# Energie-overzicht: plak dit onder `views:` in de Raw-configuratie-editor van je dashboard.
# Uitleg: https://fonferek.nl/blog/home-assistant-energie-overzicht-kosten-besparing/#stap-3-het-dashboard
  - title: Energie-overzicht
    path: energie-overzicht
    icon: mdi:cash-multiple
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Vandaag
            icon: mdi:calendar
          - type: custom:mushroom-template-card
            entity: sensor.energie_afname_dag
            primary: "Van het net"
            secondary: "{% set v = states('sensor.energie_afname_dag') | float(0) %}{{ '-' if v < 0 else '' }}€{{ '%.2f' | format(v | abs) | replace('.', ',') }} · {{ (state_attr('sensor.energie_afname_dag','kwh') | float(0)) | round(1) | string | replace('.', ',') }} kWh"
            icon: mdi:transmission-tower-import
            icon_color: "orange"
            grid_options: {columns: 6, rows: 1}
            tap_action: {action: more-info}
          - type: custom:mushroom-template-card
            entity: sensor.energie_teruglevering_dag
            primary: "Teruggeleverd"
            secondary: "{% set v = states('sensor.energie_teruglevering_dag') | float(0) %}{{ '-' if v < 0 else '' }}€{{ '%.2f' | format(v | abs) | replace('.', ',') }} · {{ (state_attr('sensor.energie_teruglevering_dag','kwh') | float(0)) | round(1) | string | replace('.', ',') }} kWh"
            icon: mdi:transmission-tower-export
            icon_color: "teal"
            grid_options: {columns: 6, rows: 1}
            tap_action: {action: more-info}
          - type: custom:mushroom-template-card
            entity: sensor.energie_netto_betaald_dag
            primary: "Netto stroomkosten {% set v = states('sensor.energie_netto_betaald_dag') | float(0) %}{{ '-' if v < 0 else '' }}€{{ '%.2f' | format(v | abs) | replace('.', ',') }}"
            secondary: "Van het net min teruggeleverd"
            icon: mdi:cash
            icon_color: "{% if states('sensor.energie_netto_betaald_dag') | float(0) <= 0 %}green{% else %}red{% endif %}"
            grid_options: {columns: 12, rows: 1}
            tap_action: {action: more-info}
          - type: custom:mushroom-template-card
            entity: sensor.energie_gas_dag
            primary: "Gas"
            secondary: "{% set v = states('sensor.energie_gas_dag') | float(0) %}{{ '-' if v < 0 else '' }}€{{ '%.2f' | format(v | abs) | replace('.', ',') }} · {{ (state_attr('sensor.energie_gas_dag','m3') | float(0)) | round(1) | string | replace('.', ',') }} m³"
