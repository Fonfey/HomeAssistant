      - type: grid
        cards:
          - type: heading
            heading: Uitleg
            icon: mdi:information-outline
          - type: markdown
            content: |
              **Van het net** · Stroom die je hebt ingekocht, elke kWh tegen de prijs van dat moment.

              **Teruggeleverd** · Stroom die je aan het net hebt geleverd, en wat dat opleverde.

              **Netto stroomkosten** · Wat je per saldo voor stroom betaalt: van het net min teruggeleverd. Groen betekent dat je meer terugkreeg dan je betaalde.

              **Gas** · Gas dat je hebt verbruikt, elke m³ tegen de gasprijs van die dag.

              **Stroom + gas** · Je totale energiekosten: netto stroomkosten plus gas.

              **Zonnestroom** · Alles wat je panelen opwekten, tegen de netprijs van dat moment. Dit had je anders moeten inkopen.

              **Batterijwinst** · Wat de batterij opleverde bij ontladen, min wat het laden kostte. Rood betekent dat laden meer kostte dan ontladen opleverde. Na een nacht laden staat dit tijdelijk in de min, tot de batterij in de dure uren weer ontlaadt.

              **Totaal bespaard** · Zonnestroom plus batterijwinst. Daaronder staat wat je zonder zon en batterij had betaald.

              *Alleen variabele kosten voor stroom en gas, zonder vastrecht en netbeheer. Tik op een kaart voor het verloop.*
