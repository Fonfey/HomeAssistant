# Uitleg: https://fonferek.nl/blog/home-assistant-energie-overzicht-kosten-besparing/
# Energie-overzicht: plak dit bestand ongewijzigd in packages/energie_overzicht.yaml
# Je eigen sensoren stel je in bovenaan custom_templates/energie.jinja.
template:
  # 1. Bronnen: de stroommeters uit energie.jinja opgeteld per soort (in kWh)
  - sensor:
      - name: "Energie bron afname"
        unique_id: energie_bron_afname
        default_entity_id: sensor.energie_bron_afname
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:transmission-tower-import
        state: "{% from 'energie.jinja' import bron %}{{ bron('afname') }}"
        availability: "{% from 'energie.jinja' import bron_ok %}{{ bron_ok('afname') }}"
      - name: "Energie bron teruglevering"
        unique_id: energie_bron_teruglevering
        default_entity_id: sensor.energie_bron_teruglevering
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:transmission-tower-export
        state: "{% from 'energie.jinja' import bron %}{{ bron('teruglevering') }}"
        availability: "{% from 'energie.jinja' import bron_ok %}{{ bron_ok('teruglevering') }}"
      - name: "Energie bron zon"
        unique_id: energie_bron_zon
        default_entity_id: sensor.energie_bron_zon
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:solar-power
        state: "{% from 'energie.jinja' import bron %}{{ bron('zon') }}"
        availability: "{% from 'energie.jinja' import bron_ok %}{{ bron_ok('zon') }}"
      - name: "Energie bron laden"
        unique_id: energie_bron_laden
        default_entity_id: sensor.energie_bron_laden
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:battery-arrow-up
        state: "{% from 'energie.jinja' import bron %}{{ bron('laden') }}"
        availability: "{% from 'energie.jinja' import bron_ok %}{{ bron_ok('laden') }}"
      - name: "Energie bron ontladen"
        unique_id: energie_bron_ontladen
        default_entity_id: sensor.energie_bron_ontladen
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:battery-arrow-down
        state: "{% from 'energie.jinja' import bron %}{{ bron('ontladen') }}"
        availability: "{% from 'energie.jinja' import bron_ok %}{{ bron_ok('ontladen') }}"
  # 2. Tellers: elke kWh-stap maal de stroomprijs van dat moment, per dag, maand en jaar
  - triggers:
      - trigger: state
        entity_id:
          - sensor.energie_bron_afname
          - sensor.energie_bron_teruglevering
          - sensor.energie_bron_zon
          - sensor.energie_bron_laden
          - sensor.energie_bron_ontladen
      - trigger: time
        at: "00:00:00"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: event
        event_type: energie_overzicht_reset
        id: reset
    sensor:
      - name: "Energie Van het net vandaag"
        unique_id: energie_afname_dag
        default_entity_id: sensor.energie_afname_dag
        unit_of_measurement: "€"
        device_class: monetary
        state_class: total
        icon: mdi:transmission-tower-import
        state: "{% from 'energie.jinja' import energie_calc %}{{ energie_calc('afname', '%Y-%m-%d', this, 'eur', trigger.id == 'reset') }}"
        attributes:
          kwh: "{% from 'energie.jinja' import energie_calc %}{{ energie_calc('afname', '%Y-%m-%d', this, 'kwh', trigger.id == 'reset') }}"
          meterstand: "{% from 'energie.jinja' import energie_calc %}{{ energie_calc('afname', '%Y-%m-%d', this, 'meter', trigger.id == 'reset') }}"
