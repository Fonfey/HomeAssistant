        availability: "{{ has_value('sensor.energie_afname_jaar') and has_value('sensor.energie_teruglevering_jaar') and has_value('sensor.energie_zon_jaar') and has_value('sensor.energie_laden_jaar') and has_value('sensor.energie_ontladen_jaar') }}"
        state: "{{ (states('sensor.energie_zon_jaar')|float(0) + states('sensor.energie_ontladen_jaar')|float(0) - states('sensor.energie_laden_jaar')|float(0)) | round(2) }}"
      - name: "Energie Zonder zon en batterij dit jaar"
        unique_id: energie_zonder_zon_batterij_jaar
        default_entity_id: sensor.energie_zonder_zon_batterij_jaar
        unit_of_measurement: "€"
        device_class: monetary
        state_class: total
        icon: mdi:cash-remove
        availability: "{{ has_value('sensor.energie_afname_jaar') and has_value('sensor.energie_teruglevering_jaar') and has_value('sensor.energie_zon_jaar') and has_value('sensor.energie_laden_jaar') and has_value('sensor.energie_ontladen_jaar') }}"
        state: "{{ (states('sensor.energie_afname_jaar')|float(0) - states('sensor.energie_teruglevering_jaar')|float(0) + states('sensor.energie_zon_jaar')|float(0) + states('sensor.energie_ontladen_jaar')|float(0) - states('sensor.energie_laden_jaar')|float(0)) | round(2) }}"
  # 4. Gas: de gasmeter (m³) en de totale energiekosten (stroom + gas)
  - sensor:
      - name: "Energie bron gas"
        unique_id: energie_bron_gas
        default_entity_id: sensor.energie_bron_gas
        unit_of_measurement: m³
        device_class: gas
        icon: mdi:fire
        state: "{% from 'energie.jinja' import bron %}{{ bron('gas') }}"
        availability: "{% from 'energie.jinja' import bron_ok %}{{ bron_ok('gas') }}"
      - name: "Energie Stroom en gas vandaag"
        unique_id: energie_stroom_en_gas_dag
        default_entity_id: sensor.energie_stroom_en_gas_dag
        unit_of_measurement: "€"
        device_class: monetary
        state_class: total
        icon: mdi:home-lightning-bolt
        availability: "{{ has_value('sensor.energie_afname_dag') and has_value('sensor.energie_teruglevering_dag') and has_value('sensor.energie_gas_dag') }}"
        state: "{{ (states('sensor.energie_afname_dag')|float(0) - states('sensor.energie_teruglevering_dag')|float(0) + states('sensor.energie_gas_dag')|float(0)) | round(2) }}"
      - name: "Energie Stroom en gas deze maand"
        unique_id: energie_stroom_en_gas_maand
        default_entity_id: sensor.energie_stroom_en_gas_maand
        unit_of_measurement: "€"
        device_class: monetary
        state_class: total
        icon: mdi:home-lightning-bolt
        availability: "{{ has_value('sensor.energie_afname_maand') and has_value('sensor.energie_teruglevering_maand') and has_value('sensor.energie_gas_maand') }}"
        state: "{{ (states('sensor.energie_afname_maand')|float(0) - states('sensor.energie_teruglevering_maand')|float(0) + states('sensor.energie_gas_maand')|float(0)) | round(2) }}"
      - name: "Energie Stroom en gas dit jaar"
        unique_id: energie_stroom_en_gas_jaar
        default_entity_id: sensor.energie_stroom_en_gas_jaar
        unit_of_measurement: "€"
        device_class: monetary
        state_class: total
        icon: mdi:home-lightning-bolt
        availability: "{{ has_value('sensor.energie_afname_jaar') and has_value('sensor.energie_teruglevering_jaar') and has_value('sensor.energie_gas_jaar') }}"
        state: "{{ (states('sensor.energie_afname_jaar')|float(0) - states('sensor.energie_teruglevering_jaar')|float(0) + states('sensor.energie_gas_jaar')|float(0)) | round(2) }}"
  # 5. Gas-tellers: elke m³-stap maal de gasprijs van dat moment, per dag, maand en jaar
  - triggers:
      - trigger: state
        entity_id: sensor.energie_bron_gas
      - trigger: time
        at: "00:00:00"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: event
        event_type: energie_overzicht_reset
        id: reset
    sensor:
      - name: "Energie Gas vandaag"
        unique_id: energie_gas_dag
        default_entity_id: sensor.energie_gas_dag
        unit_of_measurement: "€"
        device_class: monetary
        state_class: total
        icon: mdi:fire
        state: "{% from 'energie.jinja' import energie_calc %}{{ energie_calc('gas', '%Y-%m-%d', this, 'eur', trigger.id == 'reset') }}"
        attributes:
          m3: "{% from 'energie.jinja' import energie_calc %}{{ energie_calc('gas', '%Y-%m-%d', this, 'm3', trigger.id == 'reset') }}"
          meterstand: "{% from 'energie.jinja' import energie_calc %}{{ energie_calc('gas', '%Y-%m-%d', this, 'meter', trigger.id == 'reset') }}"
          periode: "{{ now().strftime('%Y-%m-%d') }}"
      - name: "Energie Gas deze maand"
        unique_id: energie_gas_maand
        default_entity_id: sensor.energie_gas_maand
        unit_of_measurement: "€"
        device_class: monetary
        state_class: total
        icon: mdi:fire
        state: "{% from 'energie.jinja' import energie_calc %}{{ energie_calc('gas', '%Y-%m', this, 'eur', trigger.id == 'reset') }}"
        attributes:
          m3: "{% from 'energie.jinja' import energie_calc %}{{ energie_calc('gas', '%Y-%m', this, 'm3', trigger.id == 'reset') }}"
          meterstand: "{% from 'energie.jinja' import energie_calc %}{{ energie_calc('gas', '%Y-%m', this, 'meter', trigger.id == 'reset') }}"
          periode: "{{ now().strftime('%Y-%m') }}"
      - name: "Energie Gas dit jaar"
        unique_id: energie_gas_jaar
        default_entity_id: sensor.energie_gas_jaar
        unit_of_measurement: "€"
        device_class: monetary
        state_class: total
        icon: mdi:fire
        state: "{% from 'energie.jinja' import energie_calc %}{{ energie_calc('gas', '%Y', this, 'eur', trigger.id == 'reset') }}"
        attributes:
          m3: "{% from 'energie.jinja' import energie_calc %}{{ energie_calc('gas', '%Y', this, 'm3', trigger.id == 'reset') }}"
          meterstand: "{% from 'energie.jinja' import energie_calc %}{{ energie_calc('gas', '%Y', this, 'meter', trigger.id == 'reset') }}"
          periode: "{{ now().strftime('%Y') }}"
